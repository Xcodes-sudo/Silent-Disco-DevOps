apiVersion: apps/v1
kind: Deployment
metadata:
  name: silent-disco-deployment
  labels:
    app: silent-disco
spec:
  replicas: 2
  selector:
    matchLabels:
      app: silent-disco
  template:
    metadata:
      labels:
        app: silent-disco
    spec:
      containers:
      - name: silent-disco-container
        image: silent-disco-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 15
