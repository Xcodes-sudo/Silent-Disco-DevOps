define host {
    use                     linux-server
    host_name               host-gateway
    alias                   Windows Host Gateway
    address                 172.18.0.1
}

define host {
    use                     linux-server
    host_name               kubernetes-node
    alias                   Kubernetes Control Plane Node
    address                 172.18.0.2
}

define service {
    use                     generic-service
    host_name               kubernetes-node
    service_description     HTTP Web App on NodePort 30080
    check_command           check_http!-p 30080 -u /
}

define service {
    use                     generic-service
    host_name               kubernetes-node
    service_description     HTTP Index Page
    check_command           check_http!-p 30080 -u /index.html
}

define service {
    use                     generic-service
    host_name               kubernetes-node
    service_description     HTTP Event Info Page
    check_command           check_http!-p 30080 -u /event-info.html
}

define service {
    use                     generic-service
    host_name               kubernetes-node
    service_description     HTTP Register Page
    check_command           check_http!-p 30080 -u /register.html
}

define service {
    use                     generic-service
    host_name               kubernetes-node
    service_description     HTTP Confirmation Page
    check_command           check_http!-p 30080 -u /confirmation.html
}